<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unsubscribe Confirmation</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
      max-width: 480px;
      text-align: center;
      border: 1px solid #e2e8f0;
    }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #d1fae5;
      color: #059669;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin: 0 auto 20px auto;
    }
    h2 { font-size: 1.5rem; margin-bottom: 10px; }
    p { color: #64748b; font-size: 0.95rem; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h2>Unsubscribed Successfully</h2>
    <p>{{ message }}</p>
    {% if email %}
      <p style="margin-top: 12px; font-weight: 600; color: #334155;">{{ email }}</p>
    {% endif %}
    <p style="font-size: 0.85rem; margin-top: 24px; color: #94a3b8;">
      You will no longer receive marketing emails from this sender.
    </p>
  </div>
</body>
</html>
