{% extends "base.html" %}

{% block title %}Register - Bulk Email Automation{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
  <div class="card" style="width: 100%; max-width: 440px; padding: 32px;">
    <div style="text-align: center; margin-bottom: 24px;">
      <div class="sidebar-brand-icon" style="margin: 0 auto 16px auto; width: 48px; height: 48px; font-size: 1.5rem;">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <h2 style="font-weight: 700; font-size: 1.5rem;">Create Account</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Setup your email automation account</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" name="full_name" class="form-control" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="johndoe" required>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">
        <i class="fa-solid fa-check"></i> Register Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
      Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
