{% extends "base.html" %}

{% block title %}Login - Bulk Email Automation{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
  <div class="card" style="width: 100%; max-width: 420px; padding: 32px;">
    <div style="text-align: center; margin-bottom: 24px;">
      <div class="sidebar-brand-icon" style="margin: 0 auto 16px auto; width: 48px; height: 48px; font-size: 1.5rem;">
        <i class="fa-solid fa-paper-plane"></i>
      </div>
      <h2 style="font-weight: 700; font-size: 1.5rem;">Welcome Back</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to your bulk email dashboard</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label class="form-label">Username or Email</label>
        <input type="text" name="username" class="form-control" placeholder="admin or email@domain.com" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Register here</a>
    </div>
  </div>
</div>
{% endblock %}
